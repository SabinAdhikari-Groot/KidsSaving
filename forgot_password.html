<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - KidsSaving</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.8em;
            margin-top: 4px;
            display: none;
        }

        .input-error {
            border-color: #e74c3c;
        }

        .button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .button:hover {
            background-color: #2980b9;
        }

        .back-button {
            background-color: #95a5a6;
        }

        .back-button:hover {
            background-color: #7f8c8d;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    <div class="container">
        <h2>Forgot Password</h2>
        <p class="message">
            Enter your email address and we'll send you a verification code to reset your password.
        </p>
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="email-error"></span>
            </div>
            <button type="submit" class="button">Send Verification Code</button>
            <button type="button" class="button back-button" onclick="window.location.href='login.html'">Back to Login</button>
        </form>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email');
            const emailError = document.getElementById('email-error');
            
            // Clear previous errors
            emailError.style.display = 'none';
            email.classList.remove('input-error');

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.style.display = 'block';
                email.classList.add('input-error');
                return;
            }

            try {
                // Show loading overlay
                document.querySelector('.loading-overlay').style.display = 'flex';

                // Check if email exists in database
                const response = await fetch('check_email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(email.value)}`
                });

                const data = await response.json();
                
                if (data.exists) {
                    // Store email in session storage
                    sessionStorage.setItem('resetEmail', email.value);
                    
                    // Send verification code
                    const sendCodeResponse = await fetch('send_verification.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `email=${encodeURIComponent(email.value)}`
                    });
                    
                    const sendCodeData = await sendCodeResponse.json();

                    if(sendCodeData.success) {
                         // Redirect to verification page
                        window.location.href = 'reset_verification.html';
                    } else {
                        // Handle potential error from send_verification.php
                        emailError.textContent = sendCodeData.message || 'Failed to send verification code.';
                        emailError.style.display = 'block';
                         // Hide loading overlay in case of error from send_verification.php
                        document.querySelector('.loading-overlay').style.display = 'none';
                    }
                   
                } else {
                    emailError.textContent = 'No account found with this email address';
                    emailError.style.display = 'block';
                    email.classList.add('input-error');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                emailError.textContent = 'An error occurred. Please try again.';
                emailError.style.display = 'block';
            } finally {
                // Hide loading overlay
                document.querySelector('.loading-overlay').style.display = 'none';
            }
        });
    </script>
</body>
</html>
