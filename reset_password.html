<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - KidsSaving</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.8em;
            margin-top: 4px;
            display: none;
        }

        .input-error {
            border-color: #e74c3c;
        }

        .button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .button:hover {
            background-color: #2980b9;
        }

        .back-button {
            background-color: #95a5a6;
        }

        .back-button:hover {
            background-color: #7f8c8d;
        }

        .password-requirements {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        .requirement {
            margin: 2px 0;
        }

        .requirement.met {
            color: #27ae60;
        }

        .requirement.unmet {
            color: #e74c3c;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            color: #27ae60;
            margin-bottom: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    <div class="container">
        <h2>Reset Password</h2>
        <p class="message">
            Please enter your new password below.
        </p>
        <div class="success-message" id="successMessage">Password changed successfully! Redirecting to login...</div>
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
                <span class="error-message" id="password-error"></span>
                <div class="password-requirements" id="password-requirements">
                    <div class="requirement" id="length-req">8-64 characters long</div>
                    <div class="requirement" id="number-req">At least 1 number</div>
                    <div class="requirement" id="special-req">At least 1 special character (!@#$%^&*)</div>
                    <div class="requirement" id="capital-req">At least 1 capital letter</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                <span class="error-message" id="confirm-password-error"></span>
            </div>

            <button type="submit" class="button">Reset Password</button>
            <button type="button" class="button back-button" onclick="window.location.href='reset_verification.html'">Back</button>
        </form>
    </div>

    <script>
        // Real-time password validation
        const password = document.getElementById('password');
        const requirements = {
            length: document.getElementById('length-req'),
            number: document.getElementById('number-req'),
            special: document.getElementById('special-req'),
            capital: document.getElementById('capital-req')
        };

        password.addEventListener('input', function() {
            const value = this.value;
            
            // Check length
            if (value.length >= 8 && value.length <= 64) {
                requirements.length.classList.add('met');
                requirements.length.classList.remove('unmet');
            } else {
                requirements.length.classList.add('unmet');
                requirements.length.classList.remove('met');
            }

            // Check for number
            if (/\d/.test(value)) {
                requirements.number.classList.add('met');
                requirements.number.classList.remove('unmet');
            } else {
                requirements.number.classList.add('unmet');
                requirements.number.classList.remove('met');
            }

            // Check for special character
            if (/[!@#$%^&*]/.test(value)) {
                requirements.special.classList.add('met');
                requirements.special.classList.remove('unmet');
            } else {
                requirements.special.classList.add('unmet');
                requirements.special.classList.remove('met');
            }

            // Check for capital letter
            if (/[A-Z]/.test(value)) {
                requirements.capital.classList.add('met');
                requirements.capital.classList.remove('unmet');
            } else {
                requirements.capital.classList.add('unmet');
                requirements.capital.classList.remove('met');
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            let isValid = true;

            // Clear previous errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('input-error');
            });

            // Password validation
            const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*])(?=.*[A-Z])(?=.*[a-z]).{8,64}$/;
            if (!passwordRegex.test(password.value)) {
                showError(password, 'password-error', 'Password must meet all requirements');
                isValid = false;
            }

            // Password confirmation
            const confirmPassword = document.getElementById('confirm-password');
            if (password.value !== confirmPassword.value) {
                showError(confirmPassword, 'confirm-password-error', 'Passwords do not match');
                isValid = false;
            }

            if (isValid) {
                try {
                    // Show loading overlay
                    document.querySelector('.loading-overlay').style.display = 'flex';

                    const response = await fetch('reset_password.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: `password=${encodeURIComponent(password.value)}&email=${encodeURIComponent(sessionStorage.getItem('resetEmail'))}`
                    });

                    const data = await response.json();
                    if (data.success) {
                        // Show success message
                        document.getElementById('successMessage').style.display = 'block';
                        // Clear session storage
                        sessionStorage.removeItem('resetEmail');
                        // Redirect after 5 seconds
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 5000);
                    } else {
                        showError(password, 'password-error', data.message);
                    }
                } catch (error) {
                    showError(password, 'password-error', 'An error occurred. Please try again.');
                } finally {
                    // Hide loading overlay
                    document.querySelector('.loading-overlay').style.display = 'none';
                }
            }
        });

        function showError(input, errorId, message) {
            const errorElement = document.getElementById(errorId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            input.classList.add('input-error');
        }
    </script>
</body>
</html>
