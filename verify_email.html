<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - KidsSaving</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verification-container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .verification-message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .verification-code {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .verification-code input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .verification-code input:focus {
            border-color: #3498db;
            outline: none;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .timer {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .resend-button {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 1.5rem;
        }

        .resend-button:disabled {
            color: #999;
            cursor: not-allowed;
        }

        .verify-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .verify-button:hover {
            background-color: #2980b9;
        }

        .back-button {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }

        .back-button:hover {
            background-color: #7f8c8d;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 1rem;
            display: none;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
    <div class="verification-container">
        <h2>Verify Your Email</h2>
        <p class="verification-message">
            We've sent a verification code to your email address.<br>
            Please enter the code below to complete your registration.
        </p>
        <div class="verification-code">
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        </div>
        <div class="timer">Time remaining: <span id="countdown">10:00</span></div>
        <button class="resend-button" id="resendButton" disabled>Resend Code</button>
        <button class="verify-button" id="verifyButton">Verify Code</button>
        <button class="verify-button back-button" onclick="window.location.href='signup.html'">Back</button>
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage" style="display: none; color: #27ae60; margin-top: 1rem; font-weight: bold;">Email successfully verified! Redirecting...</div>
    </div>

    <script>
        // Handle input fields
        const inputs = document.querySelectorAll('.verification-code input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer functionality
        let timeLeft = 60; // 60 seconds
        const countdownElement = document.getElementById('countdown');
        const resendButton = document.getElementById('resendButton');

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateTimer, 1000);
            } else {
                resendButton.disabled = false;
            }
        }

        updateTimer();

        // Resend code functionality
        resendButton.addEventListener('click', async () => {
            try {
                // Show loading overlay
                document.querySelector('.loading-overlay').style.display = 'flex';
                
                const response = await fetch('send_verification.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(sessionStorage.getItem('pendingEmail'))}`
                });
                
                const data = await response.json();
                if (data.success) {
                    timeLeft = 60;
                    updateTimer();
                    resendButton.disabled = true;
                    showError('New verification code sent!', false);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError('Failed to resend verification code');
            } finally {
                // Hide loading overlay
                document.querySelector('.loading-overlay').style.display = 'none';
            }
        });

        // Verify code functionality
        document.getElementById('verifyButton').addEventListener('click', async () => {
            const code = Array.from(inputs).map(input => input.value).join('');
            
            // Clear previous messages
            showError('', false); // Clear error message
            document.getElementById('successMessage').style.display = 'none'; // Hide success message

            try {
                // Show loading overlay
                document.querySelector('.loading-overlay').style.display = 'flex';
                
                // Verify the code via AJAX
                const response = await fetch('verify_code.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `code=${code}`
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Code verified successfully, now submit the original signup form data
                    const formData = new FormData();
                    const originalData = JSON.parse(sessionStorage.getItem('pendingSignupData'));
                    
                    // Append all original form data fields
                    for (const [key, value] of Object.entries(originalData)) {
                        formData.append(key, value);
                    }

                    // Send the full signup data to signup.php
                    const signupResponse = await fetch('signup.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const signupData = await signupResponse.json();

                    if (signupData.success) {
                        // Signup successful, show success message and provide a link

                        // Hide verification elements
                        document.querySelector('.verification-container h2').style.display = 'none';
                        document.querySelector('.verification-message').style.display = 'none';
                        document.querySelector('.verification-code').style.display = 'none';
                        document.querySelector('.timer').style.display = 'none';
                        document.getElementById('resendButton').style.display = 'none';
                        document.getElementById('verifyButton').style.display = 'none';
                        document.querySelector('.back-button').style.display = 'none';
                        
                        // Hide loading overlay
                        document.querySelector('.loading-overlay').style.display = 'none';

                        // Show success message area and set content
                        const successMessageElement = document.getElementById('successMessage');
                        successMessageElement.textContent = 'Code successfully verified! '; // Set initial text
                        successMessageElement.style.display = 'block';

                        // Create and append the clickable link
                        const loginLink = document.createElement('a');
                        loginLink.href = 'login.html';
                        loginLink.textContent = 'Click here to go to login page';
                        loginLink.style.color = '#3498db'; // Style the link to look clickable
                        loginLink.style.textDecoration = 'underline';
                        loginLink.style.cursor = 'pointer';

                        successMessageElement.appendChild(loginLink);

                        // Clear session storage data related to signup pending
                        sessionStorage.removeItem('pendingSignupData');
                        sessionStorage.removeItem('pendingEmail');

                    } else {
                        // Signup failed after verification
                        showError(signupData.message || 'Registration failed after verification');
                    }

                } else {
                    // Code verification failed
                    showError(data.message);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                showError('An error occurred. Please try again.');
            } finally {
                // Hide loading overlay (unless signup failed and we need to show error)
                 if (!document.getElementById('successMessage').style.display || document.getElementById('successMessage').style.display === 'none') {
                     document.querySelector('.loading-overlay').style.display = 'none';
                 }
            }
        });

        function showError(message, isError = true) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            errorElement.style.color = isError ? '#e74c3c' : '#27ae60';
        }

        // Back button functionality
        document.getElementById('backButton').addEventListener('click', () => {
            // Don't clear session storage, just redirect
            window.location.href = 'signup.html';
        });
    </script>
</body>
</html>
